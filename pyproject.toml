[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "A small, honest routing lab: route bug-fix stages across local and Groq models and measure whether it beats one big model."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]
page = ["playwright>=1.40"]

[tool.setuptools]
packages = ["relay", "evalkit", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
